name: Build ESPHome Firmware

on: 
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets.yaml if missing
        run: |
          if [ ! -f secrets.yaml ]; then
            echo "wifi_ssid: 'DummyWiFi'" > secrets.yaml
            echo "wifi_password: 'DummyPassword'" >> secrets.yaml
          fi

      - name: Compile firmware and save log
        run: |
          esphome compile jkbms.yaml 2>&1 | tee compile_output.txt
        continue-on-error: true

      - name: Upload compilation log
        uses: actions/upload-artifact@v4
        with:
          name: esphome-build-log
          path: compile_output.txt

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: dual-jkbms-firmware
          path: .esphome/build/*/.pioenvs/*/firmware.bin
          if-no-files-found: warn
