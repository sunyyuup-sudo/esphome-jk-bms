name: Build ESPHome Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & ESPHome
        id: cache-platformio
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            .esphome
          key: ${{ runner.os }}-esphome-v4-${{ hashFiles('**/jkbms.yaml') }}
          restore-keys: |
            ${{ runner.os }}-esphome-v4-

      - name: Pre-download ESP-IDF Toolchain (if not cached)
        if: steps.cache-platformio.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.platformio/packages
          echo "Downloading ESP-IDF toolchain..."
          wget --retry-connrefused --waitretry=2 --read-timeout=30 --timeout=20 -t 10 \
            https://github.com/pioarduino/esp-idf/releases/download/v5.5.4/esp-idf-v5.5.4.tar.xz \
            -O /tmp/esp-idf-v5.5.4.tar.xz
          
          mkdir -p ~/.platformio/packages/framework-espidf
          echo "Unpacking ESP-IDF..."
          tar -xJf /tmp/esp-idf-v5.5.4.tar.xz -C ~/.platformio/packages/framework-espidf --strip-components=1
          rm /tmp/esp-idf-v5.5.4.tar.xz

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Build ESPHome Firmware
        run: |
          esphome compile jkbms.yaml

      - name: Check generated binaries
        run: |
          echo "=== Searching for generated .bin files ==="
          find .esphome/build -type f -name "*.bin"

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dual-jkibms-dashboard-binary
          path: |
            .esphome/build/dual-jkibms-dashboard/.pioenvs/dual-jkibms-dashboard/firmware.bin
            .esphome/build/dual-jkibms-dashboard/.pioenvs/dual-jkibms-dashboard/firmware.factory.bin
            .esphome/build/dual-jkibms-dashboard/.pioenvs/dual-jkibms-dashboard/firmware.ota.bin
          if-no-files-found: error
