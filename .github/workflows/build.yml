name: Build ESPHome Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & ESPHome components
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            .esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('**/jkbms.yaml') }}
          restore-keys: |
            ${{ runner.os }}-esphome-

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Build ESPHome binary
        run: |
          esphome compile jkbms.yaml

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: esphome-binary
          path: .esphome/build/*/.pioenvs/*/*.bin
