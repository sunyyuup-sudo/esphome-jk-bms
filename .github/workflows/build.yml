name: Build ESPHome Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Compile ESPHome Binary
        run: |
          esphome compile jkbms.yaml

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-jkbms-firmware
          path: .esphome/build/dual-jkbms-dashboard/.pioenvs/dual-jkbms-dashboard/firmware.bin
