    min_cell_voltage:
      name: "1️⃣0️⃣0️⃣ Мін. комірка"
    max_cell_voltage:
      name: "1️⃣0️⃣0️⃣ Макс. комірка"
    charging_power_tube_temperature:
      name: "1️⃣0️⃣0️⃣ MOSFET M"
    temperature_1:
      name: "1️⃣0️⃣0️⃣ Термодатчик 1"
    temperature_2:
      name: "1️⃣0️⃣0️⃣ Термодатчик 2"
    cell_1_voltage:
      name: "1️⃣0️⃣0️⃣ Комірка 1"
    cell_2_voltage:
      name: "1️⃣0️⃣0️⃣ Комірка 2"
    cell_3_voltage:
      name: "1️⃣0️⃣0️⃣ Комірка 3"
    cell_4_voltage:
      name: "1️⃣0️⃣0️⃣ Комірка 4"
    cell_5_voltage:
      name: "1️⃣0️⃣0️⃣ Комірка 5"
