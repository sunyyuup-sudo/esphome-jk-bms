sensor:
  # ================= БАТАРЕЯ 1 (Червона батарейка) =================
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1

    total_voltage:
      name: "🪫 [АКБ 1] Напруга"
      id: bms1_total_voltage
    current:
      name: "🪫 [АКБ 1] Струм"
      id: bms1_current
    power:
      name: "🪫 [АКБ 1] Потужність"
      id: bms1_power
    state_of_charge:
      name: "🪫 [АКБ 1] SOC (%)"
      id: bms1_soc
    capacity_remaining:
      name: "🪫 [АКБ 1] Залишок (Ач)"
      id: bms1_capacity_remaining
    min_cell_voltage:
      name: "🪫 [АКБ 1] Мін. комірка A"
      id: bms1_min_cell
    max_cell_voltage:
      name: "🪫 [АКБ 1] Макс. комірка B"
      id: bms1_max_cell
    delta_cell_voltage:
      name: "🪫 [АКБ 1] Дельта C"
      id: bms1_delta
    mosfet_temperature:
      name: "🪫 [АКБ 1] MOSFET M"
      id: bms1_mosfet_temp
    temperature_sensor_1:
      name: "🪫 [АКБ 1] Термодатчик 1"
      id: bms1_temp_1
    temperature_sensor_2:
      name: "🪫 [АКБ 1] Термодатчик 2"
