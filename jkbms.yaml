esphome:
  name: jkbms-dashboard

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: "Ta2"
  password: "09122004"

# Залишаємо локальний веб-сервер як резервний канал
web_server:
  port: 80

# Локальний API для можливих інтеграцій
api:

# Інтеграція з MQTT для мобільного додатка MQTT Dash
mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"

esp32_ble_tracker:

ble_client:
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: jkbms_ble_client

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  ble_client_id: jkbms_ble_client
  id: jkbms_dev
  protocol_version: JK02_32S

# Перемикачі керування ключами та балансуванням
switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev
    charging:
      name: "Керування зарядом (Charge)"
    discharging:
      name: "Керування розрядом (Discharge)"
    balancer:
      name: "Балансувальник (Balancer)"

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev
    restart:
      name: "Перезавантажити BMS"

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev

    # Загальні параметри АКБ
    total_voltage:
      name: "Напруга АКБ"
    current:
      name: "Струм"
    power:
      name: "Потужність"
    state_of_charge:
      name: "Заряд SOC (%)"
    capacity_remaining:
      name: "Залишкова ємність (Ач)"
    
    # Дельта і межі комірок
    min_cell_voltage:
      name: "Мін. напруга комірки"
    max_cell_voltage:
      name: "Макс. напруга комірки"
    delta_cell_voltage:
      name: "Різниця напруг (Дельта)"

    # Температури
    power_tube_temperature:
      name: "Температура MOSFET"
    temperature_sensor_1:
      name: "Температура АКБ T1"
    temperature_sensor_2:
      name: "Температура АКБ T2"

    # 8 комірок
    cell_voltage_1:
      name: "Комірка 1"
    cell_voltage_2:
      name: "Комірка 2"
    cell_voltage_3:
      name: "Комірка 3"
    cell_voltage_4:
      name: "Комірка 4"
    cell_voltage_5:
      name: "Комірка 5"
    cell_voltage_6:
      name: "Комірка 6"
    cell_voltage_7:
      name: "Комірка 7"
    cell_voltage_8:
      name: "Комірка 8"