text_sensor:
  # Динамічні індикатори заряду для обох батарей
  - platform: template
    name: "4️⃣0️⃣ Рівень заряду"
    id: bms1_status_icon
    lambda: |-
      float soc = id(bms1_soc).state;
      if (soc > 80) {
        return {"🟢  ( >80% )"};
      } else if (soc > 60) {
        return {"🔵 ( 61-80% )"};
      } else if (soc > 40) {
        return {"🟡 ( 41-60% )"};
      } else if (soc > 20) {
        return {"🟠 ( 21-40% )"};
      } else {
        return {"🔴 ( <=20% )"};
      }
    update_interval: 10s

  - platform: template
    name: "1️⃣0️⃣0️⃣ Рівень заряду"
    id: bms2_status_icon
    lambda: |-
      float soc = id(bms2_soc).state;
      if (soc > 80) {
        return {"🟢  ( >80% )"};
      } else if (soc > 60) {
        return {"🔵 ( 61-80% )"};
      } else if (soc > 40) {
        return {"🟡 ( 41-60% )"};
      } else if (soc > 20) {
        return {"🟠 ( 21-40% )"};
      } else {
        return {"🔴 ( <=20% )"};
      }
    update_interval: 10s

switch:
  # ================= 40 вимикачі =================
  - platform: jkbms
    jkbms_id: my_jkbms_1
    charging:
      name: "⚡4️⃣0️⃣ Заряд"
      id: bms1_charging_switch
    discharging:
      name: "⚡4️⃣0️⃣ Розряд"
      id: bms1_discharging_switch
    balancer:
      name: "⚖️4️⃣0️⃣ Балансир"
      id: bms1_balancer_switch

  # ================= 100 вимикачі =================
  - platform: jkbms
    jkbms_id: my_jkbms_2
    charging:
      name: "⚡1️⃣0️⃣0️⃣ Заряд"
      id: bms2_charging_switch
    discharging:
      name: "⚡1️⃣0️⃣0️⃣ Розряд"
      id: bms2_discharging_switch
    balancer:
      name: "⚖️1️⃣0️⃣0️⃣ Балансир"
      id: bms2_balancer_switch

button:
  - platform: jkbms
    jkbms_id: my_jkbms_1
    shutdown:
      name: "🌙4️⃣0️⃣ Вимкнути (Сон)"
    reset:
      name: "💫4️⃣0️⃣ Перезавантажити"

  - platform: jkbms
    jkbms_id: my_jkbms_2
    shutdown:
      name: "🌙1️⃣0️⃣0️⃣ Вимкнути (Сон)"
    reset:
      name: "💫1️⃣0️⃣0️⃣ Перезавантажити"

mqtt:
  on_json_message:
    - topic: "jkbms_ta2/command/bat40/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_balancer_switch).turn_off();
            }

    - topic: "jkbms_ta2/command/bat100/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_balancer_switch).turn_off();
            }
