    cell_3_voltage:
      name: "4️⃣0️⃣ Комірка 3"
    cell_4_voltage:
      name: "4️⃣0️⃣ Комірка 4"
    cell_5_voltage:
      name: "4️⃣0️⃣ Комірка 5"
    cell_6_voltage:
      name: "4️⃣0️⃣ Комірка 6"
    cell_7_voltage:
      name: "4️⃣0️⃣ Комірка 7"
    cell_8_voltage:
      name: "4️⃣0️⃣ Комірка 8"

