esphome:
  name: dual-jkibms-dashboard
  friendly_name: Акумулятори

external_components:
  - source: github://syssi/esphome-jk-bms
    components: [ jk_bms_ble ]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: "Ta2"
  password: "09122004"
  power_save_mode: LIGHT

# Веб-інтерфейс (порт 80)
web_server:
  port: 80
  version: 2

logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jk_bms_ble: WARN
    mqtt: WARN

# Обов’язковий компонент для роботи sensor.debug
debug:

ota:
  - platform: esphome

esp32_ble:

ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: bms_dev_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: bms_dev_2

jk_bms_ble:
  - ble_client_id: bms_dev_1
    id: my_jkbms_1
    protocol_version: 'JK02_32S'
    update_interval: 15s

  - ble_client_id: bms_dev_2
    id: my_jkbms_2
    protocol_version: 'JK02_32S'
    update_interval: 15s

sensor:
  # Тепер працюватиме коректно
  - platform: debug
    free:
      name: "Вільна оперативна пам'ять Heap"

  # Далі ваші сенсори BMS без змін...
