esphome:
  name: dual-jkibms-dashboard
  friendly_name: Акумулятори

external_components:
  - source: github://syssi/esphome-jk-bms
    components: [ jk_bms_ble ]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: "Ta2"
  password: "09122004"

logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jk_bms_ble: WARN
    mqtt: WARN

api:

ota:
  - platform: esphome

esp32_ble:

ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: bms_dev_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: bms_dev_2

jk_bms_ble:
  - ble_client_id: bms_dev_1
    id: my_jkbms_1
    protocol_version: 'JK02_32S'
    update_interval: 5s

  - ble_client_id: bms_dev_2
    id: my_jkbms_2
    protocol_version: 'JK02_32S'
    update_interval: 5s

sensor:
  # ================= АКУМУЛЯТОР 40 =================
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    total_voltage:
      name: "BAT 40 Volt"
      id: bms1_total_voltage
    current:
      name: "BAT 40 Current"
      id: bms1_current
    power:
      name: "BAT 40 Power"
      id: bms1_power
    capacity_remaining:
      name: "BAT 40 Rem"
      id: bms1_capacity_remaining
    delta_cell_voltage:
      name: "BAT 40 Delta"
      id: bms1_delta
    min_cell_voltage:
      name: "BAT 40 Min Cell"
    max_cell_voltage:
      name: "BAT 40 Max Cell"
    mosfet_temperature:
      name: "BAT 40 MOSFET"
    temperature_sensor_1:
      name: "BAT 40 Temp 1"
    temperature_sensor_2:
      name: "BAT 40 Temp 2"
    cell_voltage_1:
      name: "BAT 40 C1"
    cell_voltage_2:
      name: "BAT 40 C2"
    cell_voltage_3:
      name: "BAT 40 C3"
    cell_voltage_4:
      name: "BAT 40 C4"
    cell_voltage_5:
      name: "BAT 40 C5"
    cell_voltage_6:
      name: "BAT 40 C6"
    cell_voltage_7:
      name: "BAT 40 C7"
    cell_voltage_8:
      name: "BAT 40 C8"

  # ================= АКУМУЛЯТОР 100 =================
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    total_voltage:
      name: "BAT 100 Volt"
      id: bms2_total_voltage
    current:
      name: "BAT 100 Current"
      id: bms2_current
    power:
      name: "BAT 100 Power"
      id: bms2_power
    capacity_remaining:
      name: "BAT 100 Rem"
      id: bms2_capacity_remaining
    delta_cell_voltage:
      name: "BAT 100 Delta"
      id: bms2_delta
    min_cell_voltage:
      name: "BAT 100 Min Cell"
    max_cell_voltage:
      name: "BAT 100 Max Cell"
    mosfet_temperature:
      name: "BAT 100 MOSFET"
    temperature_sensor_1:
      name: "BAT 100 Temp 1"
    temperature_sensor_2:
      name: "BAT 100 Temp 2"
    cell_voltage_1:
      name: "BAT 100 C1"
    cell_voltage_2:
      name: "BAT 100 C2"
    cell_voltage_3:
      name: "BAT 100 C3"
    cell_voltage_4:
      name: "BAT 100 C4"
    cell_voltage_5:
      name: "BAT 100 C5"
    cell_voltage_6:
      name: "BAT 100 C6"
    cell_voltage_7:
      name: "BAT 100 C7"
    cell_voltage_8:
      name: "BAT 100 C8"

switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    charging:
      name: "BAT 40 Charge"
      id: bms1_charging_switch
    discharging:
      name: "BAT 40 Discharge"
      id: bms1_discharging_switch
    balancer:
      name: "BAT 40 Balancer"
      id: bms1_balancer_switch

  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    charging:
      name: "BAT 100 Charge"
      id: bms2_charging_switch
    discharging:
      name: "BAT 100 Discharge"
      id: bms2_discharging_switch
    balancer:
      name: "BAT 100 Balancer"
      id: bms2_balancer_switch

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    restart:
      name: "BAT 40 Reset"

  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    restart:
      name: "BAT 100 Reset"

mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"
  on_json_message:
    - topic: "jkbms_ta2/command/bat40/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_balancer_switch).turn_off();
            }

    - topic: "jkbms_ta2/command/bat100/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_balancer_switch).turn_off();
            }
