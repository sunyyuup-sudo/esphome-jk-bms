esphome:
  name: dual-jkibms-dashboard
  friendly_name: Акумулятори

external_components:
  - source: github://syssi/esphome-jk-bms
    components: [ jk_bms_ble ]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: "Ta2"
  password: "09122004"

# Вмикаємо легкий веб-інтерфейс (порт 80)
web_server:
  port: 1883
  version: 2

logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jk_bms_ble: WARN
    mqtt: WARN

ota:
  - platform: esphome

esp32_ble:

ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: bms_dev_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: bms_dev_2

jk_bms_ble:
  - ble_client_id: bms_dev_1
    id: my_jkbms_1
    protocol_version: 'JK02_32S'
    update_interval: 10s

  - ble_client_id: bms_dev_2
    id: my_jkbms_2
    protocol_version: 'JK02_32S'
    update_interval: 10s

sensor:
  # ================= АКУМУЛЯТОР 40 =================
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    total_voltage:
      name: "4️⃣0️⃣ Напруга V"
      id: bms1_total_voltage
    current:
      name: "4️⃣0️⃣ Струм A"
      id: bms1_current
    power:
      name: "4️⃣0️⃣ Потужність W"
      id: bms1_power
    capacity_remaining:
      name: "4️⃣0️⃣ Залишок Ah"
      id: bms1_capacity_remaining
    delta_cell_voltage:
      name: "4️⃣0️⃣ Дельта mV"
      id: bms1_delta
    min_cell_voltage:
      name: "4️⃣0️⃣ Мін комірка Min"
    max_cell_voltage:
      name: "4️⃣0️⃣ Макс комірка Max"
    mosfet_temperature:
      name: "4️⃣0️⃣ MOSFET T"
    temperature_sensor_1:
      name: "4️⃣0️⃣ Термодатчик 1 T1"
    temperature_sensor_2:
      name: "4️⃣0️⃣ Термодатчик 2 T2"
    cell_voltage_1:
      name: "4️⃣0️⃣ Комірка 1 C1"
    cell_voltage_2:
      name: "4️⃣0️⃣ Комірка 2 C2"
    cell_voltage_3:
      name: "4️⃣0️⃣ Комірка 3 C3"
    cell_voltage_4:
      name: "4️⃣0️⃣ Комірка 4 C4"
    cell_voltage_5:
      name: "4️⃣0️⃣ Комірка 5 C5"
    cell_voltage_6:
      name: "4️⃣0️⃣ Комірка 6 C6"
    cell_voltage_7:
      name: "4️⃣0️⃣ Комірка 7 C7"
    cell_voltage_8:
      name: "4️⃣0️⃣ Комірка 8 C8"

  # ================= АКУМУЛЯТОР 100 =================
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    total_voltage:
      name: "1️⃣0️⃣0️⃣ Напруга V"
      id: bms2_total_voltage
    current:
      name: "1️⃣0️⃣0️⃣ Струм A"
      id: bms2_current
    power:
      name: "1️⃣0️⃣0️⃣ Потужність W"
      id: bms2_power
    capacity_remaining:
      name: "1️⃣0️⃣0️⃣ Залишок Ah"
      id: bms2_capacity_remaining
    delta_cell_voltage:
      name: "1️⃣0️⃣0️⃣ Дельта mV"
      id: bms2_delta
    min_cell_voltage:
      name: "1️⃣0️⃣0️⃣ Мін комірка Min"
    max_cell_voltage:
      name: "1️⃣0️⃣0️⃣ Макс комірка Max"
    mosfet_temperature:
      name: "1️⃣0️⃣0️⃣ MOSFET T"
    temperature_sensor_1:
      name: "1️⃣0️⃣0️⃣ Термодатчик 1 T1"
    temperature_sensor_2:
      name: "1️⃣0️⃣0️⃣ Термодатчик 2 T2"
    cell_voltage_1:
      name: "1️⃣0️⃣0️⃣ Комірка 1 C1"
    cell_voltage_2:
      name: "1️⃣0️⃣0️⃣ Комірка 2 C2"
    cell_voltage_3:
      name: "1️⃣0️⃣0️⃣ Комірка 3 C3"
    cell_voltage_4:
      name: "1️⃣0️⃣0️⃣ Комірка 4 C4"
    cell_voltage_5:
      name: "1️⃣0️⃣0️⃣ Комірка 5 C5"
    cell_voltage_6:
      name: "1️⃣0️⃣0️⃣ Комірка 6 C6"
    cell_voltage_7:
      name: "1️⃣0️⃣0️⃣ Комірка 7 C7"
    cell_voltage_8:
      name: "1️⃣0️⃣0️⃣ Комірка 8 C8"

switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    charging:
      name: "4️⃣0️⃣ Заряд Ch"
      id: bms1_charging_switch
    discharging:
      name: "4️⃣0️⃣ Розряд Dch"
      id: bms1_discharging_switch
    balancer:
      name: "4️⃣0️⃣ Балансир Bal"
      id: bms1_balancer_switch

  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    charging:
      name: "1️⃣0️⃣0️⃣ Заряд Ch"
      id: bms2_charging_switch
    discharging:
      name: "1️⃣0️⃣0️⃣ Розряд Dch"
      id: bms2_discharging_switch
    balancer:
      name: "1️⃣0️⃣0️⃣ Балансир Bal"
      id: bms2_balancer_switch

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    restart:
      name: "4️⃣0️⃣ Перезавантажити Rst"

  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    restart:
      name: "1️⃣0️⃣0️⃣ Перезавантажити Rst"

mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"
  on_message:
    - topic: "jkbms_ta2/command/bat40/charging"
      then:
        - lambda: |-
            if (x == "ON") {
              id(bms1_charging_switch).turn_on();
            } else if (x == "OFF") {
              id(bms1_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/discharging"
      then:
        - lambda: |-
            if (x == "ON") {
              id(bms1_discharging_switch).turn_on();
            } else if (x == "OFF") {
              id(bms1_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/balancer"
      then:
        - lambda: |-
            if (x == "ON") {
              id(bms1_balancer_switch).turn_on();
            } else if (x == "OFF") {
              id(bms1_balancer_switch).turn_off();
            }

    - topic: "jkbms_ta2/command/bat100/charging"
      then:
        - lambda: |-
            if (x == "ON") {
              id(bms2_charging_switch).turn_on();
            } else if (x == "OFF") {
              id(bms2_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/discharging"
      then:
        - lambda: |-
            if (x == "ON") {
              id(bms2_discharging_switch).turn_on();
            } else if (x == "OFF") {
              id(bms2_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/balancer"
      then:
        - lambda: |-
            if (x == "ON") {
              id(bms2_balancer_switch).turn_on();
            } else if (x == "OFF") {
              id(bms2_balancer_switch).turn_off();
            }
