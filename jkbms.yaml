esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: "Ta2"
  password: "09122004"

logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jkbms: WARN
    mqtt: WARN

api:

ota:
  - platform: esphome

mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"

esp32_ble:

ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: jkbms_dev_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: jkbms_dev_2

jkbms:
