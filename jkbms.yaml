interval:
  - interval: 10s
    then:
      - mqtt.publish_json:
          topic: "jkbms_ta2/batteries/json"
          payload: |-
            root["bat40"]["voltage"] = id(bms1_total_voltage).state;
            root["bat40"]["current"] = id(bms1_current).state;
            root["bat40"]["power"] = id(bms1_power).state;
            root["bat40"]["soc"] = id(bms1_soc).state;
            root["bat40"]["capacity_remaining"] = id(bms1_capacity_remaining).state;
            root["bat40"]["min_cell"] = id(bms1_min_cell).state;
            root["bat40"]["max_cell"] = id(bms1_max_cell).state;
            root["bat40"]["delta"] = id(bms1_delta).state;
            root["bat40"]["charging"] = id(bms1_chg_sw).state;
            root["bat40"]["discharging"] = id(bms1_dsg_sw).state;
            root["bat40"]["balancer"] = id(bms1_bal_sw).state;

            root["bat100"]["voltage"] = id(bms2_total_voltage).state;
            root["bat100"]["current"] = id(bms2_current).state;
            root["bat100"]["power"] = id(bms2_power).state;
            root["bat100"]["soc"] = id(bms2_soc).state;
            root["bat100"]["capacity_remaining"] = id(bms2_capacity_remaining).state;
            root["bat100"]["min_cell"] = id(bms2_min_cell).state;
            root["bat100"]["max_cell"] = id(bms2_max_cell).state;
            root["bat100"]["delta"] = id(bms2_delta).state;
            root["bat100"]["charging"] = id(bms2_chg_sw).state;
            root["bat100"]["discharging"] = id(bms2_dsg_sw).state;
            root["bat100"]["balancer"] = id(bms2_bal_sw).state;
