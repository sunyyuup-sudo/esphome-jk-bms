sensor:
  # ================= БАТАРЕЯ 1 (40Ah) =================
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1

    total_voltage:
      id: bms1_total_voltage
      name: "🟢 [40A] Напруга АКБ"
      icon: "mdi:lightning-bolt"
    current:
      id: bms1_current
      name: "🟢 [40A] Струм"
      icon: "mdi:current-dc"
    power:
      id: bms1_power
      name: "🟢 [40A] Потужність"
      icon: "mdi:flash"
    state_of_charge:
      id: bms1_soc
      name: "🟢 [40A] Заряд SOC (%)"
      icon: "mdi:battery-50"
    capacity_remaining:
      id: bms1_capacity_remaining
      name: "🟢 [40A] Залишок ємності (Ач)"
      icon: "mdi:gauge"
    
    min_cell_voltage:
      id: bms1_min_cell_voltage
      name: "🟢 [40A] Мін. напруга комірки"
      icon: "mdi:battery-arrow-down"
    max_cell_voltage:
      id: bms1_max_cell_voltage
      name: "🟢 [40A] Макс. напруга комірки"
      icon: "mdi:battery-arrow-up"
    delta_cell_voltage:
      id: bms1_delta_cell_voltage
      name: "🟢 [40A] Дельта комірок"
      icon: "mdi:sigma-lower"

    mosfet_temperature:
      id: bms1_mosfet_temp
      name: "🟢 [40A] Температура MOSFET"
      icon: "mdi:microchip"
    temperature_sensor_1:
      id: bms1_temp1
      name: "🟢 [40A] Температура T1"
      icon: "mdi:thermometer"
    temperature_sensor_2:
      id: bms1_temp2
      name: "🟢 [40A] Температура T2"
      icon: "mdi:thermometer"

    cell_voltage_1:
      id: bms1_cell_1
      name: "🟢 [40A] Комірка 1"
      icon: "mdi:battery-single"
    cell_voltage_2:
      id: bms1_cell_2
      name: "🟢 [40A] Комірка 2"
      icon: "mdi:battery-single"
    cell_voltage_3:
      id: bms1_cell_3
      name: "🟢 [40A] Комірка 3"
      icon: "mdi:battery-single"
    cell_voltage_4:
      id: bms1_cell_4
      name: "🟢 [40A] Комірка 4"
      icon: "mdi:battery-single"
    cell_voltage_5:
      id: bms1_cell_5
      name: "🟢 [40A] Комірка 5"
      icon: "mdi:battery-single"
    cell_voltage_6:
      id: bms1_cell_6
      name: "🟢 [40A] Комірка 6"
      icon: "mdi:battery-single"
    cell_voltage_7:
      id: bms1_cell_7
      name: "🟢 [40A] Комірка 7"
      icon: "mdi:battery-single"
    cell_voltage_8:
      id: bms1_cell_8
      name: "🟢 [40A] Комірка 8"
      icon: "mdi:battery-single"

