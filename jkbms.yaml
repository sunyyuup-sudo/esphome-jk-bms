  - platform: jkbms
    jkbms_id: my_jkbms_2
    total_voltage:
      name: "1️⃣0️⃣0️⃣ Напруга"
      id: bms2_total_voltage
    current:
      name: "1️⃣0️⃣0️⃣ Струм"
      id: bms2_current
    power:
      name: "1️⃣0️⃣0️⃣ Потужність"
      id: bms2_power
    soc:
      name: "1️⃣0️⃣0️⃣ SOC"
      id: bms2_soc
    capacity_remaining:
      name: "1️⃣0️⃣0️⃣ Залишок"
      id: bms2_capacity_remaining
    delta_cell_voltage:
      name: "1️⃣0️⃣0️⃣ Дельта"
