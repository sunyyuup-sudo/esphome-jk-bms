esphome:
  name: dual-jkibms-dashboard
  friendly_name: Акумулятори

external_components:
  - source: github://syssi/esphome-jk-bms
    components: [ jk_bms_ble ]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: "Ta2"
  password: "09122004"

logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jk_bms_ble: WARN
    mqtt: WARN

api:

ota:
  - platform: esphome

esp32_ble:

ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: bms_dev_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: bms_dev_2

jk_bms_ble:
  - ble_client_id: bms_dev_1
    id: my_jkbms_1
    protocol_version: 'JK02_32S'
    update_interval: 5s

  - ble_client_id: bms_dev_2
    id: my_jkbms_2
    protocol_version: 'JK02_32S'
    update_interval: 5s

sensor:
  # ================= АКУМУЛЯТОР 40 =================
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    total_voltage:
      name: "АКБ 40 Напруга"
      id: bms1_total_voltage
    current:
      name: "АКБ 40 Струм"
      id: bms1_current
    power:
      name: "АКБ 40 Потужність"
      id: bms1_power
    capacity_remaining:
      name: "АКБ 40 Залишок"
      id: bms1_capacity_remaining
    delta_cell_voltage:
      name: "АКБ 40 Дельта"
      id: bms1_delta
    min_cell_voltage:
      name: "АКБ 40 Мін комірка"
      id: bms1_min_cell
    max_cell_voltage:
      name: "АКБ 40 Макс комірка"
      id: bms1_max_cell
    mosfet_temperature:
      name: "АКБ 40 MOSFET M"
      id: bms1_mosfet_temp
    temperature_sensor_1:
      name: "АКБ 40 Термодатчик 1"
      id: bms1_temp_1
    temperature_sensor_2:
      name: "АКБ 40 Термодатчик 2"
      id: bms1_temp_2
    cell_voltage_1:
      name: "АКБ 40 Комірка 1"
      id: bms1_c1
    cell_voltage_2:
      name: "АКБ 40 Комірка 2"
      id: bms1_c2
    cell_voltage_3:
      name: "АКБ 40 Комірка 3"
      id: bms1_c3
    cell_voltage_4:
      name: "АКБ 40 Комірка 4"
      id: bms1_c4
    cell_voltage_5:
      name: "АКБ 40 Комірка 5"
      id: bms1_c5
    cell_voltage_6:
      name: "АКБ 40 Комірка 6"
      id: bms1_c6
    cell_voltage_7:
      name: "АКБ 40 Комірка 7"
      id: bms1_c7
    cell_voltage_8:
      name: "АКБ 40 Комірка 8"
      id: bms1_c8

  # ================= АКУМУЛЯТОР 100 =================
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    total_voltage:
      name: "АКБ 100 Напруга"
      id: bms2_total_voltage
    current:
      name: "АКБ 100 Струм"
      id: bms2_current
    power:
      name: "АКБ 100 Потужність"
      id: bms2_power
    capacity_remaining:
      name: "АКБ 100 Залишок"
      id: bms2_capacity_remaining
    delta_cell_voltage:
      name: "АКБ 100 Дельта"
      id: bms2_delta
    min_cell_voltage:
      name: "АКБ 100 Мін комірка"
      id: bms2_min_cell
    max_cell_voltage:
      name: "АКБ 100 Макс комірка"
      id: bms2_max_cell
    mosfet_temperature:
      name: "АКБ 100 MOSFET M"
      id: bms2_mosfet_temp
    temperature_sensor_1:
      name: "АКБ 100 Термодатчик 1"
      id: bms2_temp_1
    temperature_sensor_2:
      name: "АКБ 100 Термодатчик 2"
      id: bms2_temp_2
    cell_voltage_1:
      name: "АКБ 100 Комірка 1"
      id: bms2_c1
    cell_voltage_2:
      name: "АКБ 100 Комірка 2"
      id: bms2_c2
    cell_voltage_3:
      name: "АКБ 100 Комірка 3"
      id: bms2_c3
    cell_voltage_4:
      name: "АКБ 100 Комірка 4"
      id: bms2_c4
    cell_voltage_5:
      name: "АКБ 100 Комірка 5"
      id: bms2_c5
    cell_voltage_6:
      name: "АКБ 100 Комірка 6"
      id: bms2_c6
    cell_voltage_7:
      name: "АКБ 100 Комірка 7"
      id: bms2_c7
    cell_voltage_8:
      name: "АКБ 100 Комірка 8"
      id: bms2_c8

text_sensor:
  - platform: template
    name: "АКБ 40 Рівень заряду"
    id: bms1_status_icon
    lambda: |-
      return {"🟢"};
    update_interval: 10s

  - platform: template
    name: "АКБ 100 Рівень заряду"
    id: bms2_status_icon
    lambda: |-
      return {"🟢"};
    update_interval: 10s

switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    charging:
      name: "АКБ 40 Заряд"
      id: bms1_charging_switch
    discharging:
      name: "АКБ 40 Розряд"
      id: bms1_discharging_switch
    balancing:
      name: "АКБ 40 Балансир"
      id: bms1_balancer_switch

  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    charging:
      name: "АКБ 100 Заряд"
      id: bms2_charging_switch
    discharging:
      name: "АКБ 100 Розряд"
      id: bms2_discharging_switch
    balancing:
      name: "АКБ 100 Балансир"
      id: bms2_balancer_switch

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_1
    sleep:
      name: "АКБ 40 Сон"
    reset:
      name: "АКБ 40 Перезавантажити"

  - platform: jk_bms_ble
    jk_bms_ble_id: my_jkbms_2
    sleep:
      name: "АКБ 100 Сон"
    reset:
      name: "АКБ 100 Перезавантажити"

mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"
  on_json_message:
    - topic: "jkbms_ta2/command/bat40/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_balancer_switch).turn_off();
            }

    - topic: "jkbms_ta2/command/bat100/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_balancer_switch).turn_off();
            }
