esphome:
  name: jkbms-dashboard

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: "Ta2"
  password: "09122004"

# Автономний локальний веб-сервер (Дашборд)
web_server:
  port: 80

esp32_ble_tracker:

ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: jkbms_ble_client

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  ble_client_id: jkbms_ble_client
  id: jkbms_dev
  protocol_version: JK04  # Обов'язкова версія протоколу для нових версій інтеграції

sensor:
  - platform: jk_bms_ble
    jkbms_ble_id: jkbms_dev
    total_voltage:
      name: "Напруга АКБ"
    current:
      name: "Струм"
    power:
      name: "Потужність"
    state_of_charge:
      name: "Заряд SOC (%)"
    min_cell_voltage:
      name: "Мін. напруга комірки"
    max_cell_voltage:
      name: "Макс. напруга комірки"
