esphome:
  name: dual-jkbms-dashboard

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: "Ta2"
  password: "09122004"

# Резервний веб-сервер (порт 80)
web_server:
  port: 80

# Можливість оновлення прошивки по Wi-Fi (OTA)
ota:
  - platform: esphome

# Локальний API для можливих інтеграцій
api:

# Налаштування логування
logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jk_bms_ble: WARN
    mqtt: WARN

# Інтеграція з MQTT для мобільного додатка MQTT Dash
mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"

esp32_ble_tracker:

# Реєструємо дві плати BMS за їхніми MAC-адресами
ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: jkbms_ble_client_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: jkbms_ble_client_2

external_components:
  - source: github://syssi/esphome-jk-bms@main

# Ініціалізація першої BMS (40Ah)
jk_bms_ble:
  - ble_client_id: jkbms_ble_client_1
    id: jkbms_dev_1
    protocol_version: JK02_32S

# Ініціалізація другої BMS (100Ah)
  - ble_client_id: jkbms_ble_client_2
    id: jkbms_dev_2
    protocol_version: JK02_32S

# Перемикачі керування
switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1
    charging:
      name: "🟢 [40A] Заряд"
      icon: "mdi:battery-charging"
    discharging:
      name: "🟢 [40A] Розряд"
      icon: "mdi:power-plug"
    balancer:
      name: "🟢 [40A] Балансир"
      icon: "mdi:scale-balance"

  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_2
    charging:
      name: "🔴 [100A] Заряд"
      icon: "mdi:battery-charging"
    discharging:
      name: "🔴 [100A] Розряд"
      icon: "mdi:power-plug"
    balancer:
      name: "🔴 [100A] Балансир"
      icon: "mdi:scale-balance"

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1
    restart:
      name: "🟢 [40A] Перезавантажити"
      icon: "mdi:restart"
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_2
    restart:
      name: "🔴 [100A] Перезавантажити"
      icon: "mdi:restart"

sensor:
  # ================= БАТАРЕЯ 1 (40Ah) =================
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1

    total_voltage:
      name: "🟢 [40A] Напруга АКБ"
      icon: "mdi:lightning-bolt"
    current:
      name: "🟢 [40A] Струм"
      icon: "mdi:current-dc"
    power:
      name: "🟢 [40A] Потужність"
      icon: "mdi:flash"
    state_of_charge:
      name: "🟢 [40A] Заряд SOC (%)"
      icon: "mdi:battery-50"
    capacity_remaining:
      name: "🟢 [40A] Залишок ємності (Ач)"
      icon: "mdi:gauge"
    
    min_cell_voltage:
      name: "🟢 [40A] Мін. напруга комірки"
      icon: "mdi:battery-arrow-down"
    max_cell_voltage:
      name: "🟢 [40A] Макс. напруга комірки"
      icon: "mdi:battery-arrow-up"
    delta_cell_voltage:
      name: "🟢 [40A] Дельта комірок"
      icon: "mdi:sigma-lower"

    power_tube_temperature:
      name: "🟢 [40A] Температура MOSFET"
      icon: "mdi:microchip"
    temperature_sensor_1:
      name: "🟢 [40A] Температура T1"
      icon: "mdi:thermometer"
    temperature_sensor_2:
      name: "🟢 [40A] Температура T2"
      icon: "mdi:thermometer"

    cell_voltage_1:
      name: "🟢 [40A] Комірка 1"
      icon: "mdi:battery-single"
    cell_voltage_2:
      name: "🟢 [40A] Комірка 2"
      icon: "mdi:battery-single"
    cell_voltage_3:
      name: "🟢 [40A] Комірка 3"
      icon: "mdi:battery-single"
    cell_voltage_4:
      name: "🟢 [40A] Комірка 4"
      icon: "mdi:battery-single"
    cell_voltage_5:
      name: "🟢 [40A] Комірка 5"
      icon: "mdi:battery-single"
    cell_voltage_6:
      name: "🟢 [40A] Комірка 6"
      icon: "mdi:battery-single"
    cell_voltage_7:
      name: "🟢 [40A] Комірка 7"
      icon: "mdi:battery-single"
    cell_voltage_8:
      name: "🟢 [40A] Комірка 8"
      icon: "mdi:battery-single"

  # ================= БАТАРЕЯ 2 (100Ah) =================
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_2

    total_voltage:
      name: "🔴 [100A] Напруга АКБ"
      icon: "mdi:lightning-bolt"
    current:
      name: "🔴 [100A] Струм"
      icon: "mdi:current-dc"
    power:
      name: "🔴 [100A] Потужність"
      icon: "mdi:flash"
    state_of_charge:
      name: "🔴 [100A] Заряд SOC (%)"
      icon: "mdi:battery-80"
    capacity_remaining:
      name: "🔴 [100A] Залишок ємності (Ач)"
      icon: "mdi:gauge"
    
    min_cell_voltage:
      name: "🔴 [100A] Мін. напруга комірки"
      icon: "mdi:battery-arrow-down"
    max_cell_voltage:
      name: "🔴 [100A] Макс. напруга комірки"
      icon: "mdi:battery-arrow-up"
    delta_cell_voltage:
      name: "🔴 [100A] Дельта комірок"
      icon: "mdi:sigma-lower"

    power_tube_temperature:
      name: "🔴 [100A] Температура MOSFET"
      icon: "mdi:microchip"
    temperature_sensor_1:
      name: "🔴 [100A] Температура T1"
      icon: "mdi:thermometer"
    temperature_sensor_2:
      name: "🔴 [100A] Температура T2"
      icon: "mdi:thermometer"

    cell_voltage_1:
      name: "🔴 [100A] Комірка 1"
      icon: "mdi:battery-single"
    cell_voltage_2:
      name: "🔴 [100A] Комірка 2"
      icon: "mdi:battery-single"
    cell_voltage_3:
      name: "🔴 [100A] Комірка 3"
      icon: "mdi:battery-single"
    cell_voltage_4:
      name: "🔴 [100A] Комірка 4"
      icon: "mdi:battery-single"
    cell_voltage_5:
      name: "🔴 [100A] Комірка 5"
      icon: "mdi:battery-single"
    cell_voltage_6:
      name: "🔴 [100A] Комірка 6"
      icon: "mdi:battery-single"
    cell_voltage_7:
      name: "🔴 [100A] Комірка 7"
      icon: "mdi:battery-single"
    cell_voltage_8:
      name: "🔴 [100A] Комірка 8"
      icon: "mdi:battery-single"
