esphome:
  name: akumulyators
  friendly_name: "Акумулятори"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: "Ta2"
  password: "09122004"

# Резервний веб-сервер
web_server:
  port: 80

# Можливість оновлення прошивки по Wi-Fi (OTA)
ota:
  - platform: esphome

# Локальний API
api:

# Налаштування логування
logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jk_bms_ble: WARN
    mqtt: WARN

# Інтеграція з MQTT
mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"

esp32_ble_tracker:

# Реєструємо дві плати BMS за їхніми MAC-адресами
ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: jkbms_ble_client_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: jkbms_ble_client_2

external_components:
  - source: github://syssi/esphome-jk-bms@main

# Ініціалізація першої BMS
jk_bms_ble:
  - ble_client_id: jkbms_ble_client_1
    id: jkbms_dev_1
    protocol_version: JK02_32S

# Ініціалізація другої BMS
  - ble_client_id: jkbms_ble_client_2
    id: jkbms_dev_2
    protocol_version: JK02_32S

# Перемикачі керування для обох плат
switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1
    charging:
      id: bms1_switch_charging
      name: "🟢 [40A]- Керування зарядом"
      icon: "mdi:battery-charging"
    discharging:
      id: bms1_switch_discharging
      name: "🟢 [40A]- Керування розрядом"
      icon: "mdi:power-plug"
    balancer:
      id: bms1_switch_balancer
      name: "🟢 [40A]- Балансувальник"
      icon: "mdi:scale-balance"

  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_2
    charging:
      id: bms2_switch_charging
      name: "🔴 [100A]- Керування зарядом"
      icon: "mdi:battery-charging"
    discharging:
      id: bms2_switch_discharging
      name: "🔴 [100A]- Керування розрядом"
      icon: "mdi:power-plug"
    balancer:
      id: bms2_switch_balancer
      name: "🔴 [100A]- Балансувальник"
      icon: "mdi:scale-balance"

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1
    restart:
      id: bms1_btn_restart
      name: "🟢 [40A]- Перезавантажити"
      icon: "mdi:restart"

  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_2
    restart:
      id: bms2_btn_restart
      name: "🔴 [100A]- Перезавантажити"
      icon: "mdi:restart"

sensor:
  # ================= БАТАРЕЯ 1 (40Ah) =================
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_dev_1

    total_voltage:
      id: bms1_total_voltage
      name: "🟢 [40A]- Напруга АКБ"
      icon: "mdi:lightning-bolt"
    current:
      id: bms1_current
      name: "🟢 [40A]- Струм"
      icon: "mdi:current-dc"
    power:
      id: bms1_power
      name: "🟢 [40A]- Потужність"
      icon: "mdi:flash"
    charging_power:
      id: bms1_charging_power
      name: "🟢 [40A]- Потужність заряду"
      icon: "mdi:battery-charging"
    discharging_power:
      id: bms1_discharging_power
      name: "🟢 [40A]- Потужність розряду"
      icon: "mdi:power-plug"
    state_of_charge:
      id: bms1_soc
      name: "🟢 [40A]- Заряд SOC (%)"
      icon: "mdi:battery-50"
    capacity_remaining:
      id: bms1_capacity_remaining
      name: "🟢 [40A]- Залишкова ємність (Ач)"
      icon: "mdi:gauge"
    
    min_cell_voltage:
      id: bms1_min_cell_voltage
      name: "🟢 [40A]- Мін. напруга комірки"
      icon: "mdi:battery-arrow-down"
    max_cell_voltage:
      id: bms1_max_cell_voltage
      name: "🟢 [40A]- Макс. напруга комірки"
      icon: "mdi:battery-arrow-up"
    delta_cell_voltage:
      id: bms1_delta_cell_voltage
      name: "🟢 [40A]- Різниця напруг (Дельта)"
      icon: "mdi:sigma-lower"

    mosfet_temperature:
      id: bms1_mosfet_temp
      name: "🟢 [40A]- Температура MOSFET"
      icon: "mdi:microchip"
    temperature_sensor_1:
      id: bms1_temp1
      name: "🟢 [40A]- Температура АКБ T1"
      icon: "mdi:thermometer"
    temperature_sensor_2:
      id: bms1_temp2
      name: "🟢 [40A]- Температура АКБ T2"
      icon: "mdi:thermometer"

    cell_voltage_1:
      id: bms1_cell_1
      name: "🟢 [40A]- Комірка 1"
      icon: "mdi:battery-single"
    cell_voltage_2:
      id: bms1_cell_2
      name: "🟢 [40A]- Комірка 2"
      icon: "mdi:battery-single"
    cell_voltage_3:
      id: bms1_cell_3
      name: "🟢 [40A]- Комірка 3"
      icon: "mdi:battery-single"
    cell_voltage_4:
      id: bms1_cell_4
      name: "🟢 [40A]- Комірка 4"
      icon: "mdi:battery-single"
    cell_voltage_5:
      id: bms1_cell_5
      name: "🟢 [40A]- Комірка 5"
      icon: "mdi:battery-single"
    cell_voltage_6:
      id: bms1_cell_6
      name: "🟢 [40A]- Комірка 6"
      icon: "mdi:battery-single"
    cell_voltage_7:
      id: bms1_cell_7
      name: "🟢 [40A]- Комірка 7"
      icon: "mdi:battery-single"
    cell_voltage_8:
      id: bms1_cell_8
      name: "🟢 [40A]- Комірка 8"
      icon: "mdi:battery-single"

  # ================= БАТАРЕЯ 2 (100Ah) =================
