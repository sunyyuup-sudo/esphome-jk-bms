esphome:
  name: dual-jkibms-dashboard
  friendly_name: Акумулятори

external_components:
  - source: github://syssi/esphome-jk-bms
    components: [ jk_bms_ble ]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: "Ta2"
  password: "ВАШ_ПАРОЛЬ_ВІД_WIFI"

logger:
  level: WARN
  logs:
    esp32_ble: ERROR
    ble_client: ERROR
    jk_bms_ble: WARN
    mqtt: WARN

api:

ota:
  - platform: esphome

esp32_ble:

ble_client:
  - mac_address: "98:DA:F0:0A:E9:85"
    id: bms_dev_1
  - mac_address: "A4:C1:38:0F:3A:D5"
    id: bms_dev_2

sensor:
  # ================= АКУМУЛЯТОР 40 =================
  - platform: jk_bms_ble
    ble_client_id: bms_dev_1
    device:
      name: "АКБ 40"
      serial_number: "JK-BMS-40"
    total_voltage:
      name: "Напруга"
      id: bms1_total_voltage
    current:
      name: "Струм"
      id: bms1_current
    power:
      name: "Потужність"
      id: bms1_power
    capacity_sos:
      name: "SOC"
      id: bms1_soc
    capacity_remaining:
      name: "Залишок"
      id: bms1_capacity_remaining
    delta_cell_voltage:
      name: "Дельта"
      id: bms1_delta
    min_cell_voltage:
      name: "Мін. комірка"
    max_cell_voltage:
      name: "Макс. комірка"
    mosfet_temperature:
      name: "MOSFET M"
    temperature_1:
      name: "Термодатчик 1"
    temperature_2:
      name: "Термодатчик 2"
    cell_1_voltage:
      name: "Комірка 1"
    cell_2_voltage:
      name: "Комірка 2"
    cell_3_voltage:
      name: "Комірка 3"
    cell_4_voltage:
      name: "Комірка 4"
    cell_5_voltage:
      name: "Комірка 5"
    cell_6_voltage:
      name: "Комірка 6"
    cell_7_voltage:
      name: "Комірка 7"
    cell_8_voltage:
      name: "Комірка 8"

  # ================= АКУМУЛЯТОР 100 =================
  - platform: jk_bms_ble
    ble_client_id: bms_dev_2
    device:
      name: "АКБ 100"
      serial_number: "JK-BMS-100"
    total_voltage:
      name: "Напруга"
      id: bms2_total_voltage
    current:
      name: "Струм"
      id: bms2_current
    power:
      name: "Потужність"
      id: bms2_power
    capacity_sos:
      name: "SOC"
      id: bms2_soc
    capacity_remaining:
      name: "Залишок"
      id: bms2_capacity_remaining
    delta_cell_voltage:
      name: "Дельта"
      id: bms2_delta
    min_cell_voltage:
      name: "Мін. комірка"
    max_cell_voltage:
      name: "Макс. комірка"
    mosfet_temperature:
      name: "MOSFET M"
    temperature_1:
      name: "Термодатчик 1"
    temperature_2:
      name: "Термодатчик 2"
    cell_1_voltage:
      name: "Комірка 1"
    cell_2_voltage:
      name: "Комірка 2"
    cell_3_voltage:
      name: "Комірка 3"
    cell_4_voltage:
      name: "Комірка 4"
    cell_5_voltage:
      name: "Комірка 5"
    cell_6_voltage:
      name: "Комірка 6"
    cell_7_voltage:
      name: "Комірка 7"
    cell_8_voltage:
      name: "Комірка 8"

text_sensor:
  - platform: template
    name: "АКБ 40 - Рівень заряду"
    id: bms1_status_icon
    lambda: |-
      float soc = id(bms1_soc).state;
      if (soc > 80) {
        return {"🟢  ( >80% )"};
      } else if (soc > 60) {
        return {"🔵 ( 61-80% )"};
      } else if (soc > 40) {
        return {"🟡 ( 41-60% )"};
      } else if (soc > 20) {
        return {"🟠 ( 21-40% )"};
      } else {
        return {"🔴 ( <=20% )"};
      }
    update_interval: 10s

  - platform: template
    name: "АКБ 100 - Рівень заряду"
    id: bms2_status_icon
    lambda: |-
      float soc = id(bms2_soc).state;
      if (soc > 80) {
        return {"🟢  ( >80% )"};
      } else if (soc > 60) {
        return {"🔵 ( 61-80% )"};
      } else if (soc > 40) {
        return {"🟡 ( 41-60% )"};
      } else if (soc > 20) {
        return {"🟠 ( 21-40% )"};
      } else {
        return {"🔴 ( <=20% )"};
      }
    update_interval: 10s

switch:
  - platform: jk_bms_ble
    ble_client_id: bms_dev_1
    charging:
      name: "АКБ 40 - Заряд"
      id: bms1_charging_switch
    discharging:
      name: "АКБ 40 - Розряд"
      id: bms1_discharging_switch
    balancing:
      name: "АКБ 40 - Балансир"
      id: bms1_balancer_switch

  - platform: jk_bms_ble
    ble_client_id: bms_dev_2
    charging:
      name: "АКБ 100 - Заряд"
      id: bms2_charging_switch
    discharging:
      name: "АКБ 100 - Розряд"
      id: bms2_discharging_switch
    balancing:
      name: "АКБ 100 - Балансир"
      id: bms2_balancer_switch

button:
  - platform: jk_bms_ble
    ble_client_id: bms_dev_1
    sleep:
      name: "АКБ 40 - Вимкнути (Сон)"
    reset:
      name: "АКБ 40 - Перезавантажити"

  - platform: jk_bms_ble
    ble_client_id: bms_dev_2
    sleep:
      name: "АКБ 100 - Вимкнути (Сон)"
    reset:
      name: "АКБ 100 - Перезавантажити"

mqtt:
  broker: broker.hivemq.com
  port: 1883
  topic_prefix: "jkbms_ta2"
  on_json_message:
    - topic: "jkbms_ta2/command/bat40/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat40/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms1_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms1_balancer_switch).turn_off();
            }

    - topic: "jkbms_ta2/command/bat100/charging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_charging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_charging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/discharging"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_discharging_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_discharging_switch).turn_off();
            }
    - topic: "jkbms_ta2/command/bat100/balancer"
      then:
        - lambda: |-
            if (payload.as<std::string>() == "ON") {
              id(bms2_balancer_switch).turn_on();
            } else if (payload.as<std::string>() == "OFF") {
              id(bms2_balancer_switch).turn_off();
            }
